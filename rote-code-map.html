s the log with the model's reason per step.", "req": "3.1", "kw": "discovery learn model openai key goal start entry"}, {"name": "replay branch", "start": 188, "end": 259, "desc": "The replay path: loads the recipe, runs it, handles --handoff by waiting for the operator, prints the result, exits 1 on blocked.", "req": "3.3", "kw": "replay run start entry handoff exit code"}, {"name": "usage", "start": 260, "end": 270, "desc": "Prints the one-screen usage if no mode word was given.", "req": "", "kw": ""}], "src": "import { mkdir, readFile, writeFile } from \"node:fs/promises\";\nimport { resolve } from \"node:path\";\nimport { CapabilityRecorder } from \"./capability/recorder.js\";\nimport { CapabilityRepository } from \"./capability/repository.js\";\nimport { config } from \"./config.js\";\nimport { DiscoveryRunner } from \"./discovery/discovery-runner.js\";\nimport { OpenAIDiscoveryModel } from \"./discovery/openai-model.js\";\nimport { FileFailureEvidence } from \"./evidence/failure-evidence.js\";\nimport { ReplayEngine } from \"./replay/replay-engine.js\";\nimport { Actuator } from \"./safety/actuator.js\";\nimport { loadPolicy } from \"./safety/policy-file.js\";\nimport { HandoffCoordinator, type HandoffRequest } from \"./session/handoff-coordinator.js\";\nimport { SessionLease } from \"./session/session-lease.js\";\nimport { PlaywrightSurfaceAdapter } from \"./surfaces/playwright-adapter.js\";\n\nconst command = process.argv[2];\nconst args = process.argv.slice(3);\n\nfunction option(name: string): string | undefined {\n  const index = args.indexOf(name);\n  return index >= 0 ? args[index + 1] : undefined;\n}\n\nfunction parseInputs(): Record<string, unknown> {\n  return args.flatMap((value, index) => value === \"--input\" ? [args[index + 1]] : [])\n    .filter((value): value is string => Boolean(value))\n    .reduce<Record<string, unknown>>((result, pair) => {\n      const separator = pair.indexOf(\"=\");\n      if (separator < 1) throw new Error(`Invalid --input '${pair}'; expected name=value`);\n      result[pair.slice(0, separator)] = pair.slice(separator + 1);\n      return result;\n    }, {});\n}\n\nfunction isSensitiveName(name: string): boolean {\n  return /password|secret|token|key/i.test(name);\n}\n\nfunction sanitizedInputs(inputs: Record<string, unknown>): Record<string, unknown> {\n  return Object.fromEntries(Object.entries(inputs).map(([name, value]) => [\n    name, isSensitiveName(name) ? \"[REDACTED]\" : value,\n  ]));\n}\n\nfunction redactSecrets(text: string, inputs: Record<string, unknown>): string {\n  return Object.entries(inputs).reduce((safe, [name, value]) =>\n    isSensitiveName(name) ? safe.replaceAll(String(value), \"[REDACTED]\") : safe, text);\n}\n\nfunction evidencePath(name: string): string {\n  if (!/^[a-z0-9][a-z0-9-]*$/i.test(name)) {\n    throw new Error(\"--evidence must contain only letters, digits, and hyphens\");\n  }\n  return resolve(\"evidence\", `${name}.json`);\n}\n\nfunction scalarContracts(\n  values: Record<string, unknown>,\n  output: boolean,\n  extractionLabel?: string,\n  extractionKind: \"text-near-label\" | \"visual-text-near-label\" = \"text-near-label\",\n) {\n  return Object.entries(values).flatMap(([name, value]) => {\n    const inferredNumericOutput = output && typeof value === \"string\" &&\n      /^\\(?[-+]?\\$?\\s*[\\d,]+(?:\\.\\d+)?\\)?$/.test(value.trim());\n    const type = inferredNumericOutput ? \"number\" : typeof value;\n    if (type !== \"string\" && type !== \"number\" && type !== \"boolean\") return [];\n    return [{\n      name,\n      type,\n      description: output ? `Value extracted for ${name}` : `Synthetic discovery input for ${name}`,\n      required: true,\n      sensitive: isSensitiveName(name),\n      ...(output && extractionLabel ? { extraction: { kind: extractionKind, label: extractionLabel } } : {}),\n    }];\n  });\n}\n\n// The target is an explicit argument. --target wins, then ROTE_TARGET_URL.\nconst targetUrl = option(\"--target\") ?? config.ROTE_TARGET_URL;\nconst target = new URL(targetUrl);\n// Guardrails come from a JSON file, so they can be changed without a rebuild.\nconst resolvePolicy = () => loadPolicy(config.ROTE_POLICY_PATH, targetUrl);\nconst failureEvidence = new FileFailureEvidence(resolve(\"evidence\", \"failures\"));\n\nif (command === \"discover\") {\n  if (!config.OPENAI_API_KEY) throw new Error(\"OPENAI_API_KEY is required for discovery\");\n  const goal = option(\"--goal\");\n  if (!goal) throw new Error(\"--goal is required for discovery\");\n  const runId = `discovery-${new Date().toISOString().replace(/[:.]/g, \"-\")}`;\n  const policy = await resolvePolicy();\n  const surface = await PlaywrightSurfaceAdapter.launch({ headless: config.ROTE_HEADLESS === \"true\" });\n  try {\n    const actuator = new Actuator(surface, policy);\n    const runner = new DiscoveryRunner(surface, actuator, new OpenAIDiscoveryModel(config.OPENAI_API_KEY, config.OPENAI_MODEL));\n    await actuator.execute({ type: \"navigate\", url: targetUrl });\n    const maxSteps = Number(option(\"--max-steps\") ?? 12);\n    const timeoutMs = Number(option(\"--timeout-ms\") ?? 120_000);\n    if (!Number.isInteger(maxSteps) || maxSteps < 1) throw new Error(\"--max-steps must be a positive integer\");\n    if (!Number.isInteger(timeoutMs) || timeoutMs < 1) throw new Error(\"--timeout-ms must be a positive integer\");\n    const inputExamples = parseInputs();\n\n    let discovery;\n    try {\n      discovery = await runner.run(goal, maxSteps, (step) => {\n        console.error(JSON.stringify({\n          step: step.index + 1,\n          action: step.action?.type ?? null,\n          reason: step.sanitizedReason,\n          goalComplete: step.goalComplete,\n        }));\n      }, timeoutMs);\n    } catch (error) {\n      // A stopped discovery run is still a run worth debugging.\n      const reason = error instanceof Error ? error.message : String(error);\n      const ref = await failureEvidence.capture({\n        runId,\n        stepId: \"discovery\",\n        errorCode: \"DISCOVERY_STOPPED\",\n        redactValues: Object.entries(inputExamples)\n          .filter(([name]) => isSensitiveName(name))\n          .map(([, value]) => String(value)),\n      }, surface);\n      const evidenceName = option(\"--evidence\");\n      if (evidenceName) {\n        await writeFile(evidencePath(evidenceName), `${JSON.stringify({\n          runType: \"openai-guided-discovery\",\n          model: config.OPENAI_MODEL,\n          target: targetUrl,\n          syntheticDataOnly: true,\n          result: \"stopped\",\n          goal: redactSecrets(goal, inputExamples),\n          stopReason: redactSecrets(reason, inputExamples),\n          ...(ref ? { evidenceRef: ref } : {}),\n        }, null, 2)}\\n`, \"utf8\");\n      }\n      throw error;\n    }\n\n    console.log(JSON.stringify(discovery, null, 2));\n    const recordName = option(\"--record\");\n    let recordedCapability: string | undefined;\n    if (recordName) {\n      const successText = option(\"--success-text\");\n      if (!successText) throw new Error(\"--success-text is required when --record is used\");\n      const extractedOutputs = discovery.at(-1)?.extractedOutputs ?? {};\n      const extractionLabel = option(\"--output-label\");\n      const extractionKind = option(\"--output-kind\") === \"visual-text-near-label\"\n        ? \"visual-text-near-label\" as const\n        : \"text-near-label\" as const;\n      const successKind = option(\"--success-kind\") === \"visual-text-visible\"\n        ? \"visual-text-visible\" as const\n        : \"text-visible\" as const;\n      const capability = new CapabilityRecorder().record({\n        name: recordName,\n        description: goal,\n        target: { application: option(\"--application\") ?? target.hostname, entryUrl: targetUrl },\n        inputs: scalarContracts(inputExamples, false),\n        inputExamples: inputExamples as Record<string, string | number | boolean>,\n        outputs: scalarContracts(extractedOutputs, true, extractionLabel, extractionKind),\n        success: { kind: successKind, expected: successText },\n      }, discovery);\n      recordedCapability = await new CapabilityRepository(resolve(\"capabilities\")).save(capability);\n      console.log(`Recorded capability: ${recordedCapability}`);\n    }\n    const evidenceName = option(\"--evidence\");\n    if (evidenceName) {\n      await writeFile(evidencePath(evidenceName), `${JSON.stringify({\n        runType: \"openai-guided-discovery\",\n        model: config.OPENAI_MODEL,\n        target: targetUrl,\n        syntheticDataOnly: true,\n        result: \"success\",\n        goal: redactSecrets(goal, inputExamples),\n        ...(recordedCapability ? { recordedCapability } : {}),\n        steps: discovery.map((step) => ({\n          index: step.index + 1,\n          action: step.action?.type ?? null,\n          reason: step.sanitizedReason,\n          goalComplete: step.goalComplete,\n          ...(step.extractedOutputs ? { extractedOutputs: step.extractedOutputs } : {}),\n        })),\n      }, null, 2)}\\n`, \"utf8\");\n    }\n  } finally {\n    await surface.close();\n  }\n} else if (command === \"replay\") {\n  const capabilityPath = option(\"--capability\");\n  if (!capabilityPath) throw new Error(\"--capability is required for replay\");\n  const capability = JSON.parse(await readFile(capabilityPath, \"utf8\")) as {\n    name?: string; description?: string; steps?: Array<{ id?: string }>;\n  };\n  const policy = await resolvePolicy();\n  const runId = `replay-${new Date().toISOString().replace(/[:.]/g, \"-\")}`;\n  await mkdir(resolve(\"evidence\", \"failures\"), { recursive: true });\n  const surface = await PlaywrightSurfaceAdapter.launch({ headless: config.ROTE_HEADLESS === \"true\" });\n  try {\n    const replayInputs = parseInputs();\n    const lease = new SessionLease();\n    const engine = new ReplayEngine(surface, new Actuator(surface, policy, lease), {\n      evidence: failureEvidence,\n      runId,\n    });\n    let result = await engine.run(capability, replayInputs);\n    let interventionRequest: Record<string, unknown> | undefined;\n\n    if (result.status === \"blocked\" && result.errorCode === \"HUMAN_INTERVENTION_REQUIRED\" && args.includes(\"--handoff\")) {\n      if (config.ROTE_HEADLESS === \"true\") throw new Error(\"--handoff requires ROTE_HEADLESS=false\");\n      const request: HandoffRequest = {\n        capability: capabilityPath,\n        goal: redactSecrets(capability.description ?? capability.name ?? capabilityPath, replayInputs),\n        code: result.errorCode,\n        reason: result.expected,\n        stepId: result.stepId,\n        stepIndex: result.stepIndex,\n        observed: result.observed,\n        resolutionCheckpoint: \"Operator Verification Required\",\n        evidenceRef: result.evidenceRef,\n      };\n      interventionRequest = HandoffCoordinator.describe(request);\n      console.error(JSON.stringify({ interventionRequest }, null, 2));\n\n      const resumeFromStepIndex = result.stepIndex;\n      const carriedRecoveries = result.recoveries ?? [];\n      await new HandoffCoordinator(lease).run(request, async () => {\n        console.error(\"Control transferred to you. Click 'Operator resolved - resume automation' in Chromium; automation will detect the change automatically.\");\n        const deadline = Date.now() + 120_000;\n        while (await surface.verify(\"text-visible\", request.resolutionCheckpoint)) {\n          if (Date.now() >= deadline) throw new Error(\"Timed out waiting for operator verification\");\n          await new Promise((resolveWait) => setTimeout(resolveWait, 500));\n        }\n        await new Promise((resolveWait) => setTimeout(resolveWait, 500));\n      }, async () => !await surface.verify(\"text-visible\", request.resolutionCheckpoint));\n\n      // Same session, no re-navigation: continue from the step that stopped.\n      result = await engine.resume(capability, await this.applyRecoveries(capability, finalIndex, \"final-checkpoint\", recoveries);\n    if (recoveryFailure) return recoveryFailure;\n\n    const terminal = await this.matchOutcome(\n      capability.knownOutcomes.filter((outcome) => outcome.resultType !== \"recoverable\"),\n    );\n    if (terminal) return this.outcomeResult(terminal, finalIndex, recoveries);\n\n    const success = await this.verify(capability.success);\n    if (!success) {\n      return this.blocked({\n        stepId: \"success-checkpoint\",\n        stepIndex: finalIndex,\n        errorCode: \"SUCCESS_CHECKPOINT_FAILED\",\n        expected: capability.success.expected,\n        observed: await this.describeObserved(),\n      }, recoveries);\n    }\n\n    const outputs: Record<string, unknown> = {};\n    for (const output of capability.outputs) {\n      if (!output.extraction) {\n        if (!output.required) continue;\n        return this.blocked({\n          stepId: `output-${output.name}`,\n          stepIndex: finalIndex,\n          errorCode: \"OUTPUT_EXTRACTION_NOT_CONFIGURED\",\n          expected: `Extraction rule for required ${output.type} output '${output.name}'`,\n          observed: \"Capability has no extraction rule\",\n        }, recoveries);\n      }\n      try {\n        const raw = await this.surface.extract(output.extraction);\n        outputs[output.name] = this.normalizeOutput(raw, output.type);\n      } catch (error) {\n        return this.blocked({\n          stepId: `output-${output.name}`,\n          stepIndex: finalIndex,\n          errorCode: \"OUTPUT_EXTRACTION_FAILED\",\n          expected: `${output.type} value near '${output.extraction.label}'`,\n          observed: error instanceof Error ? error.message : String(error),\n        }, recoveries);\n      }\n    }\n    return recoveries.length > 0\n      ? { status: \"success\", outputs, recoveries: [...recoveries] }\n      : { status: \"success\", outputs };\n  }\n\n  /**\n   * Answer every declared recoverable con const COLTITLE=["entry","learn and store","shared contracts","run and control","browser, people, evidence"];
function layout(){
  const pos={}; const W=228,H=54,GX=38,GY=14,X0=18,Y0=34;
  COLS.forEach((layers,ci)=>{ let y=Y0; for(const L of layers){ for(const f of DATA.files.filter(f=>f.layer===L)){ pos[f.path]={x:X0+ci*(W+GX),y,w:W,h:H}; y+=H+GY; } y+=6; } });
  return pos;
}
const POS=layout();
function anchor(a,b){ // from right edge of a to left edge of b (or vertical if same column)
  const ax=a.x+a.w, ay=a.y+a.h/2, bx=b.x, by=b.y+b.h/2;
  if(Math.abs(a.x-b.x)<1){ return a.y<b.y? [a.x+a.w/2,a.y+a.h,b.x+b.w/2,b.y] : [a.x+a.w/2,a.y,b.x+b.w/2,b.y+b.h]; }
  return a.x<b.x? [ax,ay,bx,by] : [a.x,ay,b.x+b.w,by];
}
function curve(x1,y1,x2,y2){ const dx=(x2-x1)/2; return `M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`; }
function mapSvg(flow,selPath){
  const onSet=new Set(flow?flow.steps.map(s=>s[0]):[]);
  let h=`<svg viewBox="0 0 1345 ${Math.max(...Object.values(POS).map(p=>p.y+p.h))+20}" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1F4E79"/></marker></defs>`;
  COLTITLE.forEach((t,i)=>{ h+=`<text class="col" x="${18+i*266}" y="20">${esc(t)}</text>`; });
  for(const f of DATA.files) for(const imp of f.imports){ const a=POS[f.path],b=POS[imp]; if(!a||!b) continue; const [x1,y1,x2,y2]=anchor(a,b); h+=`<path class="imp${flow?" dim":""}" d="${curve(x1,y1,x2,y2)}"/>`; }
  for(const f of DATA.files){ const p=POS[f.path]; const cls=flow?(onSet.has(f.path)?"on":"dim"):""; const sel=selPath===f.path?" sel":"";
    h+=`<g class="node ${cls}${sel}" data-p="${esc(f.path)}"><rect x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="6"/><text x="${p.x+10}" y="${p.y+20}" font-weight="500">${esc(f.path.replace(/^src\//,""))}</text><text class="sub" x="${p.x+10}" y="${p.y+38}">${f.funcs.length} fn · ${f.lines} lines</text></g>`; }
  if(flow){ const st=flow.steps; for(let i=0;i<st.length-1;i++){ const a=POS[st[i][0]],b=POS[st[i+1][0]]; if(!a||!b) continue; if(st[i][0]===st[i+1][0]) continue; const [x1,y1,x2,y2]=anchor(a,b); h+=`<path class="path" d="${curve(x1,y1,x2,y2)}"/>`; } }
  if(flow){ const seen={}; flow.steps.forEach((st,i)=>{ const p=POS[st[0]]; if(!p) return; seen[st[0]]=(seen[st[0]]||0); const k=seen[st[0]]++; h+=`<g class="badge"><circle cx="${p.x+p.w-14-k*20}" cy="${p.y+14}" r="9"/><text x="${p.x+p.w-14-k*20}" y="${p.y+17.5}">${i+1}</text></g>`; }); }
  return `<div class="map">${h}</svg></div>`;
}
let curFlow=null;
function wireMap(){ document.querySelectorAll(".map .node").forEach(n=>n.addEventListener("click",()=>show(n.dataset.p))); }
function flowHtml(fl,curP,curS){
  const step=(p,n,note)=>{ const f=byPath[p]; const fn=f&&f.funcs.find(x=>x.name===n); const on=curP===p&&fn&&fn.start===curS; return `<li data-p="${esc(p)}" data-s="${fn?fn.start:1}" data-e="${fn?fn.end:1}"${on?' style="background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--blue)"':""}><div class="n">${esc(n)}<small>${esc(p.replace(/^src\//,""))}${fn?` · lines ${fn.start}–${fn.end}`:""}</small></div><div>${esc(note)}</div></li>`; };
  return `<div class="flow"><h3>${esc(fl.q)}</h3><p class="line">${esc(fl.line)}</p><ol>${fl.steps.map(st=>step(...st)).join("")}</ol></div>`;
}
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim(); if(!q){ if(cur) show(cur); else $("#view").innerHTML=`<p class="empty">Pick a file on the left, or search.</p>`; return; }
  const ws=words(q); cur=null; nav();
  const flows=DATA.flows.map(fl=>[score(fl.q+" "+fl.kw,ws),fl]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,2);
  const hits=[]; for(const f of DATA.files) for(const fn of f.funcs){ const sc=score(fn.name+" "+fn.desc+" "+fn.kw+" "+f.path,ws); if(sc>0) hits.push([sc,f,fn]); }
  hits.sort((a,b)=>b[0]-a[0]);
  curFlow=flows.length?flows[0][1]:null;
  let h=flows.length?`<h2>Flow${flows.length>1?"s":""} for “${esc(q)}”</h2><div style="margin-top:12px">${mapSvg(curFlow,null)}${flows.map(x=>flowHtml(x[1])).join("")}</div>`:`<h2>“${esc(q)}”</h2><div style="margin-top:12px">${mapSvg(null,null)}</div>`;
  h+=`<h2 style="margin-top:${flows.length?18:0}px">${hits.length} function${hits.length===1?"":"s"} mention this</h2><div class="results" style="margin-top:12px">${hits.slice(0,25).map(([sc,f,fn])=>fnRow(f,fn,true)).join("")||`<p class="empty">Nothing matched. Try one plain word: transfer, lease, iframe, OCR, redact.</p>`}</div>`;
  $("#view").innerHTML=h; wire(); wireMap(); document.querySelectorAll(".flow li").forEach(el=>el.addEventListener("click",()=>show(el.dataset.p,+el.dataset.s,+el.dataset.e)));
});
// starter view: list the flows
$("#view").innerHTML=`${mapSvg(null,null)}<h2>Ask it a question</h2><p class="empty" style="margin:6px 0 14px">Type a question or a word in the search box. These are the questions with a ready-made path through the code:</p><div class="results">${DATA.flows.map(fl=>`<div class="fn" style="grid-template-columns:1fr" data-q="${esc(fl.q)}"><div>${esc(fl.q)}</div></div>`).join("")}</div>`;
wireMap(); document.querySelectorAll("[data-q]").forEach(el=>el.addEventListener("click",()=>{ $("#q").value=el.dataset.q; $("#q").dispatchEvent(new Event("input")); }));
nav();
</script></body></html>
